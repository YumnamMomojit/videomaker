<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Sem Promo — Scenes</title>
<!--
  Deterministic frame renderer. render.mjs loads this page, calls
  window.init(timeline) once and window.renderAt(t) for every frame.
  Everything on screen is a pure function of t, so any frame can be
  re-rendered in isolation (`npm run still -- 42.5`).
-->
<style>
  :root {
    --forest-900: #03110c;
    --forest-800: #062019;
    --forest-700: #0a2c22;
    --emerald: #10b981;
    --emerald-soft: #34d399;
    --gold: #d4af37;
    --gold-light: #f5df8e;
    --gold-deep: #9c7a1c;
    --ivory: #f3ecd6;
    --muted: #9fb8ad;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: var(--forest-900);
    font-family: 'Inter Display', 'Inter', 'DejaVu Sans', sans-serif;
    color: var(--ivory);
    -webkit-font-smoothing: antialiased;
  }
  .layer { position: absolute; inset: 0; }

  /* ---------- background ---------- */
  #bg {
    background:
      radial-gradient(1200px 800px at 50% 115%, rgba(16,185,129,.16), transparent 60%),
      linear-gradient(160deg, var(--forest-800) 0%, var(--forest-900) 55%, #020a07 100%);
  }
  #glow {
    position: absolute; width: 1400px; height: 1400px; border-radius: 50%;
    background: radial-gradient(circle, rgba(16,185,129,.20) 0%, rgba(16,185,129,0) 60%);
    filter: blur(20px);
  }
  #goldGlow {
    position: absolute; width: 900px; height: 900px; border-radius: 50%;
    background: radial-gradient(circle, rgba(212,175,55,.13) 0%, rgba(212,175,55,0) 62%);
    filter: blur(30px);
  }
  #grain {
    opacity: .05;
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.5) 0 1px, transparent 1px 3px);
  }

  /* ---------- scene 1: a generic, unbranded chatbot ---------- */
  #chat {
    position: absolute; left: 410px; top: 120px; width: 1100px; height: 620px;
    border-radius: 18px; background: #16181c; border: 1px solid #2a2d33;
    box-shadow: 0 40px 120px rgba(0,0,0,.55);
    font-family: 'Inter', sans-serif; overflow: hidden;
  }
  #chat .bar { height: 54px; border-bottom: 1px solid #262930; display: flex; align-items: center; padding: 0 24px; color: #8b9099; font-size: 18px; gap: 12px; }
  #chat .bar i { width: 12px; height: 12px; border-radius: 50%; background: #3a3e46; display: inline-block; }
  #chat .msgs { padding: 34px 40px; display: flex; flex-direction: column; gap: 20px; }
  #chat .msg { max-width: 70%; padding: 16px 22px; border-radius: 16px; font-size: 26px; line-height: 1.4; }
  #chat .user { align-self: flex-end; background: #2b2f37; color: #e6e7ea; }
  #chat .bot { align-self: flex-start; background: #1f2228; color: #c9ccd2; border: 1px solid #2a2d33; }
  #chat .input {
    position: absolute; left: 32px; right: 32px; bottom: 28px; height: 70px; border-radius: 14px;
    background: #1f2228; border: 1px solid #30343c; display: flex; align-items: center;
    padding: 0 24px; font-size: 25px; color: #e6e7ea;
  }
  #chat .placeholder { color: #5d626b; }
  .caret { display: inline-block; width: 2px; height: 1.05em; background: currentColor; vertical-align: -0.15em; margin-left: 2px; }
  .dots span { display: inline-block; width: 9px; height: 9px; margin: 0 3px; border-radius: 50%; background: #8b9099; }

  /* ---------- hero text ---------- */
  .hero {
    position: absolute; left: 0; right: 0; top: 50%; text-align: center;
    font-weight: 700; letter-spacing: -0.02em; color: var(--ivory);
    text-shadow: 0 6px 40px rgba(0,0,0,.45); padding: 0 120px;
  }
  .hero.xs { font-size: 34px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .hero.s  { font-size: 42px; font-weight: 500; letter-spacing: -0.005em; }
  .hero.m  { font-size: 64px; }
  .hero.l  { font-size: 88px; }
  .hl {
    background: linear-gradient(100deg, var(--gold-deep) 0%, var(--gold-light) 45%, var(--gold) 70%, var(--gold-deep) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* ---------- logo ---------- */
  .logo { position: absolute; left: 50%; top: 50%; text-align: center; }
  .logo .mark {
    position: relative; display: inline-block; font-size: 220px; font-weight: 800; letter-spacing: -0.045em; line-height: 1;
    background: linear-gradient(115deg, #0e7a57 0%, var(--emerald-soft) 30%, var(--gold-light) 52%, var(--gold) 68%, var(--gold-deep) 100%);
    background-size: 220% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 40px rgba(16,185,129,.35));
  }
  .logo img { display: block; max-width: 640px; max-height: 300px; filter: drop-shadow(0 0 40px rgba(16,185,129,.35)); }
  .logo .rule { height: 2px; margin: 18px auto 14px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .logo .by { font-size: 26px; letter-spacing: .5em; color: var(--gold-light); font-weight: 500; padding-left: .5em; }

  /* ---------- browser window ---------- */
  #win {
    position: absolute; left: 288px; top: 70px; width: 1344px; height: 804px;
    border-radius: 16px; overflow: hidden;
    background: #071a14; border: 1px solid rgba(212,175,55,.28);
    box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 50px 140px rgba(0,0,0,.6), 0 0 120px rgba(16,185,129,.12);
  }
  #win .chrome { height: 48px; background: #0b231b; border-bottom: 1px solid rgba(212,175,55,.18); display: flex; align-items: center; padding: 0 18px; gap: 9px; }
  #win .chrome i { width: 13px; height: 13px; border-radius: 50%; display: inline-block; }
  #win .url {
    margin-left: 26px; height: 30px; width: 560px; border-radius: 15px; background: #04130e;
    border: 1px solid rgba(16,185,129,.25); display: flex; align-items: center; gap: 10px; padding: 0 16px;
    font-family: 'Inter', sans-serif; font-size: 16px; color: #cfe3da;
  }
  #win .url b { color: var(--emerald-soft); font-weight: 500; }
  #content { position: absolute; left: 0; top: 48px; width: 1344px; height: 756px; background: #06150f; }

  .ph { position: absolute; inset: 22px; border: 2px dashed rgba(212,175,55,.45); border-radius: 12px;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; text-align: center; padding: 0 90px;
        background: repeating-linear-gradient(135deg, rgba(16,185,129,.035) 0 22px, transparent 22px 44px); }
  .ph .tag { position: absolute; left: 22px; top: 18px; font-size: 18px; letter-spacing: .14em; color: var(--gold); font-weight: 600; }
  .ph .unverified { position: absolute; right: 22px; top: 16px; font-size: 16px; letter-spacing: .1em; color: #f59e0b; border: 1px solid #f59e0b; padding: 4px 10px; border-radius: 6px; font-weight: 600; }
  .ph .what { font-size: 40px; font-weight: 600; color: var(--ivory); line-height: 1.25; }
  .ph .how { font-size: 23px; color: var(--muted); line-height: 1.5; max-width: 980px; font-family: 'Inter', sans-serif; }

  /* ---------- lower band: prompt pill + caption ---------- */
  #pill {
    position: absolute; left: 50%; top: 896px; height: 58px; border-radius: 29px;
    display: flex; align-items: center; gap: 14px; padding: 0 28px 0 12px; white-space: nowrap;
    background: rgba(6,32,25,.92); border: 1px solid rgba(212,175,55,.45);
    box-shadow: 0 10px 40px rgba(0,0,0,.45);
    font-family: 'Inter', sans-serif; font-size: 25px; color: var(--ivory);
  }
  #pill .ico { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--emerald), #0b6b4c); display: flex; align-items: center; justify-content: center; }
  #pill .ico svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #pill .wave { display: flex; align-items: center; gap: 3px; height: 30px; }
  #pill .wave span { width: 4px; border-radius: 2px; background: var(--gold); display: inline-block; }
  #tag { position: absolute; left: 288px; top: 905px; font-size: 18px; letter-spacing: .14em; color: var(--gold); font-weight: 600; text-transform: uppercase; }

  #caption { position: absolute; left: 0; right: 0; top: 982px; text-align: center; font-size: 46px; font-weight: 700; letter-spacing: -0.01em; text-shadow: 0 4px 30px rgba(0,0,0,.5); }
  #caption .w { display: inline-block; margin: 0 .14em; }

  #watermark { position: absolute; right: 30px; top: 22px; font-size: 16px; letter-spacing: .16em; color: #f59e0b; font-weight: 600; }
  #black { background: #000; }
</style>
</head>
<body>
  <div id="bg" class="layer"><div id="glow"></div><div id="goldGlow"></div></div>
  <div id="grain" class="layer"></div>

  <div id="chat">
    <div class="bar"><i></i><i></i><i></i><span style="margin-left:12px">Chat</span></div>
    <div class="msgs">
      <div class="msg user" id="cQ"></div>
      <div class="msg bot" id="cA"></div>
    </div>
    <div class="input" id="cIn"></div>
  </div>

  <div id="win">
    <div class="chrome">
      <i style="background:#e5534b"></i><i style="background:#d4a72c"></i><i style="background:#3fb950"></i>
      <div class="url">
        <svg width="14" height="16" viewBox="0 0 14 16"><rect x="1" y="7" width="12" height="8" rx="2" fill="#34d399"/><path d="M4 7V5a3 3 0 0 1 6 0v2" stroke="#34d399" stroke-width="1.8" fill="none"/></svg>
        <span><b>live.semdok.com</b></span>
      </div>
    </div>
    <div id="content"></div>
  </div>

  <div id="tag"></div>
  <div id="pill"><div class="ico"></div><div class="wave"></div><span class="txt"></span></div>
  <div id="caption"></div>

  <div id="heroes"></div>
  <div id="logos"></div>
  <div id="watermark"></div>
  <div id="black" class="layer"></div>

<script>
  const ICONS = {
    typed: '<svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>',
    voice: '<svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4"/></svg>',
  };

  let TL = null;
  const $ = (id) => document.getElementById(id);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
  const easeInOut = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  /** Opacity for an element visible in [a, b] with fade-in/out durations. */
  const vis = (t, a, b, fin = .5, fout = .5) => (t < a || t > b) ? 0 : Math.min(easeOut((t - a) / fin), easeOut((b - t) / fout));
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  /** `*text*` → gold highlight. */
  const rich = (s) => esc(s).replace(/\*(.+?)\*/g, '<span class="hl">$1</span>');
  const typed = (text, t, from, cps = 24) => text.slice(0, Math.max(0, Math.floor((t - from) * cps)));
  const caret = (t) => (Math.floor(t * 2) % 2 === 0 ? '<span class="caret"></span>' : '');

  window.init = (timeline) => {
    TL = timeline;
    $('heroes').innerHTML = TL.hero.map((h, i) => `<div class="hero ${h.size}" id="hero${i}">${rich(h.text)}</div>`).join('');
    const mark = TL.logoDataUrl
      ? `<img src="${TL.logoDataUrl}" alt="Sem">`
      : `<div class="mark">Sem</div>`;
    $('logos').innerHTML = TL.logos.map((l, i) =>
      `<div class="logo" id="logo${i}">${mark}<div class="rule"></div><div class="by">SEMDOK</div></div>`).join('');
    $('content').innerHTML = TL.slots.map((s, i) => s.hasRecording ? '' : `
      <div class="ph" id="ph${i}">
        <div class="tag">SCREEN RECORDING · ${esc(s.id)}</div>
        ${s.unverified ? '<div class="unverified">VERIFY FEATURE EXISTS</div>' : ''}
        <div class="what">${s.pills[0] ? '“' + esc(s.pills[0].text) + '”' : 'Clean view of Sem’s interface'}</div>
        <div class="how">${esc(s.record || '')}<br>Use Sem’s actual response — record on ${esc(TL.url)}</div>
      </div>`).join('');
    $('watermark').textContent = TL.slots.some((s) => !s.hasRecording) ? 'PREVIEW · PLACEHOLDER SLOTS' : '';
    document.fonts && document.fonts.ready;
  };

  window.renderAt = (t) => {
    // Background drifts slowly so static moments still feel alive.
    $('glow').style.transform = `translate(${-300 + Math.sin(t / 9) * 260}px, ${-500 + Math.cos(t / 11) * 120}px)`;
    $('goldGlow').style.transform = `translate(${1300 + Math.cos(t / 7) * 200}px, ${400 + Math.sin(t / 8) * 150}px)`;

    // Scene 1 — generic chatbot, deliberately neutral and unbranded.
    const g = TL.genericChat;
    const qSent = g.from + 0.6 + g.question.length / 24 + 0.25;
    const aAt = qSent + 0.55;
    const followAt = aAt + 1.3;
    const chatOp = vis(t, g.from, g.to, .6, .7) * (t > followAt + .6 ? 0.55 + 0.45 * (1 - clamp((t - followAt - .6) / .5)) : 1);
    $('chat').style.opacity = chatOp;
    $('chat').style.transform = `scale(${1 - 0.03 * clamp((t - g.from - 2) / 4)})`;
    if (chatOp > 0) {
      $('cQ').style.display = t >= qSent ? '' : 'none';
      $('cQ').textContent = g.question;
      $('cA').style.display = t >= qSent + .15 ? '' : 'none';
      $('cA').innerHTML = t < aAt ? '<span class="dots"><span></span><span></span><span></span></span>' : esc(g.answer);
      $('cIn').innerHTML = t < qSent
        ? (t < g.from + .6 ? '<span class="placeholder">Send a message…</span>' : esc(typed(g.question, t, g.from + .6)) + caret(t))
        : (t < followAt ? '<span class="placeholder">Send a message…</span>' : esc(typed(g.followUp, t, followAt, 16)) + caret(t));
    }

    // Hero lines.
    TL.hero.forEach((h, i) => {
      const el = $('hero' + i);
      const o = vis(t, h.from, h.to, .6, .45);
      el.style.opacity = o;
      el.style.transform = `translateY(calc(-50% + ${h.y + (1 - easeOut((t - h.from) / .8)) * 24}px))`;
      el.style.filter = `blur(${(1 - easeOut((t - h.from) / .6)) * 6}px)`;
    });

    // Logo reveals with a light sweep across the wordmark.
    TL.logos.forEach((l, i) => {
      const el = $('logo' + i);
      const o = vis(t, l.from, l.to, .9, .5);
      const p = easeInOut((t - l.from) / 1.6);
      el.style.opacity = o;
      el.style.transform = `translate(-50%, calc(-50% + ${l.y}px)) scale(${l.scale * (0.94 + 0.06 * p)})`;
      const mark = el.querySelector('.mark');
      if (mark) mark.style.backgroundPosition = `${100 - p * 70}% 0`;
      const rule = el.querySelector('.rule');
      rule.style.width = `${80 + 340 * easeOut((t - l.from - .4) / 1.2)}px`;
      el.querySelector('.by').style.opacity = easeOut((t - l.from - .9) / .7);
    });

    // Browser window + recording slots.
    const w = TL.window;
    const winOp = vis(t, w.from, w.to, .6, .6);
    $('win').style.opacity = winOp;
    $('win').style.transform = `scale(${0.985 + 0.015 * easeOut((t - w.from) / .8)})`;
    let active = null;
    TL.slots.forEach((s, i) => {
      const ph = $('ph' + i);
      const on = t >= s.start && t < s.end;
      if (on) active = s;
      if (ph) ph.style.opacity = on ? vis(t, s.start, s.end, .3, .3) : 0;
    });

    // Prompt pill (what the user types or says).
    let pill = null;
    if (active) for (const p of active.pills) {
      const from = p.from ?? active.start + .15, to = p.to ?? active.end - .15;
      if (t >= from && t <= to) pill = { ...p, from, to };
    }
    const pillEl = $('pill');
    pillEl.style.opacity = pill ? vis(t, pill.from, pill.to, .35, .3) * winOp : 0;
    if (pill) {
      pillEl.querySelector('.ico').innerHTML = ICONS[pill.mode] || ICONS.typed;
      const wave = pillEl.querySelector('.wave');
      if (pill.mode === 'voice') {
        wave.style.display = 'flex';
        wave.innerHTML = Array.from({ length: 16 }, (_, k) => {
          const h = 6 + Math.abs(Math.sin(t * 7.3 + k * 0.9) * Math.cos(t * 3.1 + k * 0.37)) * 24;
          return `<span style="height:${h.toFixed(1)}px"></span>`;
        }).join('');
      } else wave.style.display = 'none';
      const shown = pill.mode === 'typed' ? typed(pill.text, t, pill.from, 30) : pill.text;
      pillEl.querySelector('.txt').innerHTML = esc(shown) + (pill.mode === 'typed' && shown.length < pill.text.length ? caret(t) : '');
      pillEl.style.transform = `translate(-50%, ${(1 - easeOut((t - pill.from) / .4)) * 12}px)`;
    }
    $('tag').textContent = active && active.title ? active.title : '';
    $('tag').style.opacity = active && active.title ? vis(t, active.start, active.end, .3, .3) : 0;

    // Captions.
    const cap = TL.captions.find((c) => t >= c.from && t <= c.to);
    const capEl = $('caption');
    capEl.style.opacity = cap ? vis(t, cap.from, cap.to, .5, .4) : 0;
    if (cap) {
      if (cap.stagger) {
        const words = cap.text.split(' ');
        capEl.innerHTML = words.map((wd, k) => {
          const lit = t >= cap.from + k * cap.stagger;
          return `<span class="w ${lit ? 'hl' : ''}" style="opacity:${lit ? 1 : .35}">${esc(wd)}</span>`;
        }).join('');
      } else capEl.innerHTML = rich(cap.text);
    }

    $('black').style.opacity = clamp((t - (TL.duration - .7)) / .7) + (1 - clamp(t / .4));
  };
</script>
</body>
</html>
